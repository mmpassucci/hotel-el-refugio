 <meta name="description" content="Hotel El Refugio ofrece alojamiento confortable, habitaciones acogedoras y atención personalizada para disfrutar de una estadía tranquila y agradable. Conocé nuestras instalaciones y reservá tu estadía.>
  <meta name="keywords" content=""Hotel El Refugio, hotel en Córdoba, alojamiento en Córdoba, hospedaje en Córdoba, habitaciones de hotel, alojamiento confortable, estadía en Córdoba, reservas de hotel, hotel turístico, habitaciones acogedoras, turismo en Córdoba">

    <meta property="og:title" content="Hotel El Refugio" />
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://mmpassucci.github.io/hotel-el-refugio/" />

</head>
<body>

  <header>
    <nav class="header">
      <div class="logo"><img src="./img/logos/refugio70x70.png" alt="logo hotel el refugio"></div>
      <ul class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">El hotel</a>
      <a href="habitaciones.html">Habitaciones</a>
      <a href="novedades.html">Novedades</a>
      </ul>
    </nav>
  </header>

  <main class="reservas">
    <section class="content">
      <h2>Reservá tu Estadía</h2>
      <form class="form-contacto">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="checkin">Fecha de check-in</label>
        <input type="date" id="checkin" name="checkin" required>

        <label for="checkout">Fecha de check-out</label>
        <input type="date" id="checkout" name="checkout" required>

        <label for="huespedes">Cantidad de huéspedes</label>
        <input type="number" id="huespedes" name="huespedes" min="1" max="6" value="1" required>

        <label for="habitacion">Tipo de habitación</label>
      <input type="text" id="habitacion" name="habitacion" required placeholder="Indica: individial, doble o familiar">

        <label for="mensaje">Comentarios (opcional)</label>
        <textarea id="mensaje" name="mensaje" rows="4"></textarea>

             <button type="submit" class="btn-primary reserva">Confirmar reserva</button>

      </form>

    </section>
  </main>

    <footer class="footer">
    <div class="pfooter">
       <p>&copy; 2026 Hotel El Refugio. Todos los derechos reservados.</p>
    </div>
   
    <div class="redes">
      <a href="https://www.instagram.com/"><img src="./img/logos/instagram.png" alt="logo instagram" title="Instagram"></a>
